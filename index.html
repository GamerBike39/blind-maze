<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Labyrinthe Aveugle</title>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="topbar">
      <button id="btn-settings" title="Paramètres">⚙</button>
      <button id="btn-controls" title="Commandes">⌨</button>
    </div>
    <div id="stage">
      <div id="hud">
        <span id="hud-level">NIVEAU 1/5 · 8×8</span>
        <span id="hud-time">0:00.00</span>
        <span id="hud-right">
          <span id="hud-sonar"></span>
          <span id="hud-flash"></span>
          <span id="hud-mult"></span>
          <span id="hud-best">SCORE 0</span>
        </span>
      </div>
      <canvas id="game" width="960" height="960"></canvas>
      <div id="overlay">
        <div class="panel">
          <div class="kicker" id="ov-kicker"></div>
          <h1 id="overlay-title">LABYRINTHE AVEUGLE</h1>
          <div id="mode-list" class="hidden"></div>
          <p id="overlay-sub"></p>
          <div id="stats-grid" class="hidden"></div>
          <p class="hint" id="ov-hint">Ⓐ ou Entrée pour commencer</p>
        </div>
      </div>
      <div id="pad-status"></div>
    </div>
    <button id="btn-reset" class="hidden">↺</button>
    <button id="btn-pause" class="hidden">⏸</button>
    <div id="actions">
      <button id="act-sonar" title="Sonar (Espace / LB)">📡</button>
      <button id="act-flash" title="Éclair (G / RB)">⚡</button>
    </div>
    <div id="sticks"></div>
    <div id="dev-info" class="hidden"></div>
    <div id="modal">
      <div class="panel modal-panel">
        <button id="modal-close">✕</button>
        <div id="modal-content"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
