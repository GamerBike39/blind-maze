<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Labyrinthe Aveugle</title>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <aside class="side" id="panel-left">
      <h3>Paramètres</h3>
      <label class="row">
        <span>Volume</span>
        <input type="range" id="set-vol" min="0" max="100" value="85" />
      </label>
      <label class="row check">
        <input type="checkbox" id="set-vib" checked />
        <span>Vibrations</span>
      </label>
      <label class="row">
        <span>Trainée</span>
        <select id="set-trail">
          <option value="0.6">Courte</option>
          <option value="1" selected>Normale</option>
          <option value="1.7">Longue</option>
        </select>
      </label>
      <button id="set-wipe">Effacer records &amp; tops</button>
    </aside>
    <div id="stage">
      <div id="hud">
        <span id="hud-level">NIVEAU 1/5 · 8×8</span>
        <span id="hud-time">0:00.00</span>
        <span id="hud-right">
          <span id="hud-flash"></span>
          <span id="hud-mult"></span>
          <span id="hud-best">SCORE 0</span>
        </span>
      </div>
      <canvas id="game" width="960" height="960"></canvas>
      <div id="overlay">
        <div class="panel">
          <div class="kicker" id="ov-kicker"></div>
          <h1 id="overlay-title">LABYRINTHE AVEUGLE</h1>
          <div id="mode-list" class="hidden"></div>
          <p id="overlay-sub"></p>
          <div id="stats-grid" class="hidden"></div>
          <p class="hint" id="ov-hint">Ⓐ ou Entrée pour commencer</p>
        </div>
      </div>
      <div id="pad-status"></div>
    </div>
    <aside class="side" id="panel-right">
      <h3>Commandes</h3>
      <div id="ctrl-device"></div>
      <h4>Clavier</h4>
      <ul class="keys">
        <li><b>ZQSD / WASD</b><span>Rouler</span></li>
        <li><b>Flèches</b><span>Palper</span></li>
        <li><b>G</b><span>Éclair</span></li>
        <li><b>R</b><span>Recommencer le niveau</span></li>
        <li><b>Échap / P</b><span>Pause</span></li>
        <li><b>Entrée / Espace</b><span>Valider</span></li>
        <li><b>F</b><span>Plein écran</span></li>
      </ul>
    </aside>
    <button id="btn-reset" class="hidden">↺</button>
    <button id="btn-pause" class="hidden">⏸</button>
    <div id="sticks"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
